<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera (barcode + dates)</title>
<style>
  body{font:15px system-ui;margin:0;padding:16px;max-width:900px}
  button{padding:10px 14px;border:0;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer;margin-right:8px}
  video{width:100%;height:auto;max-height:60vh;background:#000;border:1px solid #ddd;border-radius:12px;margin:12px 0}
  h3{margin:14px 0 6px}
  table{width:100%;border-collapse:collapse;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
  th,td{padding:8px 10px;border-bottom:1px solid #e5e7eb;text-align:left}
  thead{background:#f3f4f6;font-weight:600}
  td[contenteditable]{outline:2px solid #93c5fd}
  .muted{opacity:.75}
</style>

<h2>📷 Camera</h2>
<button id="btnBarcode">Bar-code skener</button>
<button id="btnDate">Datum skener</button>

<video id="v" autoplay playsinline muted></video>

<h3>Bar-kodovi</h3>
<table>
  <thead><tr><th>Vrijeme</th><th>Kod</th><th>Ime proizvoda</th></tr></thead>
  <tbody id="codesBody"><tr class="muted"><td colspan="3">—</td></tr></tbody>
</table>

<h3>Datumi</h3>
<table>
  <thead><tr><th>Iz teksta</th><th>Vrijednost</th></tr></thead>
  <tbody id="datesBody"><tr class="muted"><td colspan="2">—</td></tr></tbody>
</table>

<script>
(function(){
  var v=document.getElementById('v');
  var codesBody=document.getElementById('codesBody');
  var datesBody=document.getElementById('datesBody');
  var codeReader=null, stream=null, autoDate=false;

  var codes = JSON.parse(localStorage.getItem('codes')||'[]'); // [{ts, code, fmt, name}]
  var dates = JSON.parse(localStorage.getItem('dates')||'[]'); // [{text, iso, approx}]

  function save(){ localStorage.setItem('codes', JSON.stringify(codes)); localStorage.setItem('dates', JSON.stringify(dates)); }
  function tsHr(ts){ try{ return new Date(ts).toLocaleString('hr-HR',{timeZone:'Europe/Zagreb'});}catch(_){return new Date(ts).toISOString();} }
  function fmtLocal(iso){ try{ return new Date(iso).toLocaleString('hr-HR',{timeZone:'Europe/Zagreb'});}catch(_){return iso;} }

  function renderCodes(){
    if (!codes.length){ codesBody.innerHTML = '<tr class="muted"><td colspan="3">—</td></tr>'; return; }
    var html = codes.map(function(c,i){
      var name = c.name && c.name.trim() ? c.name : '—';
      return '<tr data-i="'+i+'"><td>'+tsHr(c.ts)+'</td><td>'+c.code+'</td><td class="editable" contenteditable="true">'+name+'</td></tr>';
    }).join('');
    codesBody.innerHTML = html;
  }
  function renderDates(){
    if (!dates.length){ datesBody.innerHTML = '<tr class="muted"><td colspan="2">—</td></tr>'; return; }
    var html = dates.map(function(d){
      return '<tr><td>'+d.text+'</td><td>'+fmtLocal(d.iso)+(d.approx?' (≈ kraj mjeseca)':'')+'</td></tr>';
    }).join('');
    datesBody.innerHTML = html;
  }

  // ručno uređivanje imena
  codesBody.addEventListener('blur', function(e){
    var td = e.target.closest('td.editable'); if (!td) return;
    var tr = td.closest('tr'); var idx = parseInt(tr.dataset.i, 10);
    var val = td.textContent.trim();
    codes[idx].name = val;
    save();
  }, true);

  function stopAll(){
    try{ if (codeReader && codeReader.reset) codeReader.reset(); }catch(e){}
    try{ if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    stream=null; v.srcObject=null;
  }

  // ========== BARCODE (ZXing) ==========
  async function lookupProduct(code){
    try{
      const r = await fetch('/api/barcode_lookup?code='+encodeURIComponent(code));
      const j = await r.json();
      if (j && j.ok && j.name) return j.name;
      return '';
    }catch(_){ return ''; }
  }
  function startBarcode(){
    try{
      if (!codeReader) codeReader = new ZXing.BrowserMultiFormatReader();
      stopAll();
      codeReader.decodeFromVideoDevice(null, v, async function(result, err){
        if (result){
          var txt=result.getText(), fmt=result.getBarcodeFormat(), now=Date.now();
          var recent = codes.length && (now - codes[codes.length-1].ts < 2000) && codes[codes.length-1].code === txt;
          if (!recent){
            var entry = { ts: now, code: txt, fmt: fmt, name: '' };
            codes.push(entry);
            codes.sort(function(a,b){ return a.ts - b.ts; });
            renderCodes(); save();
            // dohvat imena
            try{
              var name = await lookupProduct(txt);
              if (name){ entry.name = name; renderCodes(); save(); }
            }catch(_){}
            // auto → datum
            if (!autoDate){ autoDate=true; setTimeout(function(){ dateScan(); }, 250); }
          }
        }
      });
    }catch(e){ alert('Bar-code greška: '+(e.message||e)); }
  }

  // ========== DATE OCR ==========
  function normalize(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase(); }
  var ALIAS=new Map(), A=function(arr,n){ arr.forEach(function(x){ ALIAS.set(normalize(x),n); }); };
  // HR
  A(['SIJ','SIJECANJ'],1);A(['VEL','VELJACA','VELJ'],2);A(['OZU','OZUJAK','OZUJ'],3);A(['TRA','TRAVANJ'],4);A(['SVI','SVIBANJ'],5);A(['LIP','LIPANJ'],6);
  A(['SRP','SRPANJ'],7);A(['KOL','KOLOVOZ'],8);A(['RUJ','RUJAN'],9);A(['LIS','LISTOPAD'],10);A(['STU','STUDENI'],11);A(['PRO','PROSINAC'],12);
  // EN
  A(['JAN','JANUARY'],1);A(['FEB','FEBRUARY'],2);A(['MAR','MARCH'],3);A(['APR','APRIL'],4);A(['MAY'],5);A(['JUN','JUNE'],6);A(['JUL','JULY'],7);
  A(['AUG','AUGUST'],8);A(['SEP','SEPT','SEPTEMBER'],9);A(['OCT','OCTOBER'],10);A(['NOV','NOVEMBER'],11);A(['DEC','DECEMBER'],12);
  // FR
  A(['JANV','JAN'],1);A(['FEVR','FEV','FÉVR'],2);A(['MARS','MAR'],3);A(['AVR'],4);A(['MAI'],5);A(['JUIN'],6);A(['JUIL'],7);A(['AOUT','AOÛT'],8);A(['SEPT'],9);A(['OCT'],10);A(['NOV'],11);A(['DEC','DÉC'],12);
  // IT
  A(['GEN','GENNAIO'],1);A(['FEB','FEBBRAIO'],2);A(['MAR','MARZO'],3);A(['APR','APRILE'],4);A(['MAG','MAGGIO'],5);A(['GIU','GIUGNO'],6);A(['LUG','LUGLIO'],7);A(['AGO','AGOSTO'],8);A(['SET','SETTEMBRE'],9);A(['OTT','OTTOBRE'],10);A(['NOV','NOVEMBRE'],11);A(['DIC','DICEMBRE'],12);

  function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  var MONTH_TOKEN=Array.from(ALIAS.keys()).sort(function(a,b){return b.length-a.length;}).map(esc).join('|');
  var SEP='[\\s.,/\\-]+';
  var P1=new RegExp('\\b(?<d>\\d{1,2})'+SEP+'(?<m>'+MONTH_TOKEN+')'+SEP+'(?<y>\\d{2,4})\\b','g');
  var P2=new RegExp('\\b(?<m>'+MONTH_TOKEN+')'+SEP+'(?<d>\\d{1,2})(?!\\d)'+SEP+'(?<y>\\d{2,4})\\b','g');
  var RX_DMY=/\b(?<d>0?[1-9]|[12]\d|3[01])[.\-\/ ](?<m>0?[1-9]|1[0-2])[.\-\/ ](?<y>\d{4}|\d{2})\b/g;
  var RX_YMD=/\b(?<y>\d{4})[.\-\/ ](?<m>0?[1-9]|1[0-2])[.\-\/ ](?<d>0?[1-9]|[12]\d|3[01])\b/g;
  var RX_MY =/\b(?<m>0?[1-9]|1[0-2])[.\-\/ ](?<y>\d{4})\b/g;

  function toYear(y){ y=parseInt(y,10); return y<100?2000+y:y; }
  function valid(y,m,d){ var dt=new Date(y,m-1,d); return dt.getFullYear()==y && dt.getMonth()==m-1 && dt.getDate()==d; }
  function lastDay(y,m){ return new Date(y,m,0).getDate(); }

  function parseMMM(raw){
    var nd=normalize(raw), out=[], m;
    [P1,P2].forEach(function(rx){
      rx.lastIndex=0; while ((m=rx.exec(nd))){
        var d=parseInt(m.groups.d,10), mo=ALIAS.get(m.groups.m), y=toYear(m.groups.y);
        if(!mo || !valid(y,mo,d)) continue;
        out.push({text:m[0], day:d, month:mo, year:y, iso:new Date(y,mo-1,d).toISOString(), approx:false});
      }
    });
    return out;
  }
  function parseNumeric(raw){
    var out=[], m;
    RX_DMY.lastIndex=0; while((m=RX_DMY.exec(raw))){ var d=parseInt(m.groups.d,10),mo=parseInt(m.groups.m,10),y=toYear(m.groups.y); if(valid(y,mo,d)) out.push({text:m[0],day:d,month:mo,year:y,iso:new Date(y,mo-1,d).toISOString(),approx:false}); }
    RX_YMD.lastIndex=0; while((m=RX_YMD.exec(raw))){ var d2=parseInt(m.groups.d,10),mo2=parseInt(m.groups.m,10),y2=parseInt(m.groups.y,10); if(valid(y2,mo2,d2)) out.push({text:m[0],day:d2,month:mo2,year:y2,iso:new Date(y2,mo2-1,d2).toISOString(),approx:false}); }
    RX_MY.lastIndex=0; while((m=RX_MY.exec(raw))){ var mo3=parseInt(m.groups.m,10),y3=parseInt(m.groups.y,10),d3=lastDay(y3,mo3); out.push({text:m[0],day:d3,month:mo3,year:y3,iso:new Date(y3,mo3-1,d3).toISOString(),approx:true}); }
    return out;
  }
  function dedupe(a){ var s=new Set(), o=[]; a.forEach(function(x){ var k=x.text+'|'+x.iso; if(!s.has(k)){ s.add(k); o.push(x);} }); return o; }
  function findAllDates(raw){ return dedupe([].concat(parseMMM(raw), parseNumeric(raw))); }

  async function dateScan(){
    try{
      if (!v.srcObject){
        try{ await navigator.mediaDevices.getUserMedia({video:true}); }catch(_){}
        var cons={ video:{ facingMode:{ ideal:'environment' }, width:{ideal:1280}, height:{ideal:720} }, audio:false };
        var s=await navigator.mediaDevices.getUserMedia(cons);
        stream=s; v.srcObject=s; v.muted=true; v.setAttribute('playsinline',''); await v.play();
      }
      var w=v.videoWidth||1280, h=v.videoHeight||720;
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      var ctx=cv.getContext('2d'); ctx.drawImage(v,0,0,w,h);

      var worker = await Tesseract.createWorker('eng+hrv+ita');
      var res = await worker.recognize(cv);
      await worker.terminate();

      var text = (res && res.data && res.data.text) ? res.data.text : '';
      var found = findAllDates(text);

      Array.prototype.push.apply(dates, found);
      // dedupe i sortiranje
      var seenK=new Set(), uniq=[]; for (var i=0;i<dates.length;i++){ var k=dates[i].text+'|'+dates[i].iso; if(!seenK.has(k)){ seenK.add(k); uniq.push(dates[i]); } }
      dates = uniq.sort(function(a,b){ return new Date(a.iso) - new Date(b.iso); });
      renderDates(); save();
    }catch(e){ alert('Datum skener greška: '+(e.message||e)); }
  }

  document.getElementById('btnBarcode').onclick=function(){ autoDate=false; startBarcode(); };
  document.getElementById('btnDate').onclick   =function(){ dateScan(); };

  // inicijalni prikaz iz localStorage
  renderCodes(); renderDates();
})();
</script>

<!-- Libs -->
<script src="https://unpkg.com/@zxing/library@0.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
