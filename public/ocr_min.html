<!doctype html>
<html lang="hr"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OCR (minimal)</title>
<style>
  body{font:14px system-ui;margin:0;padding:16px;max-width:900px}
  .card{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px}
  canvas{max-width:100%;border:1px dashed #ccc;border-radius:8px}
  #log{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;background:#0b1020;color:#e6edf3;padding:10px;border-radius:8px;min-height:80px}
</style>
</head>
<body>
<h2>🔎 OCR (minimal)</h2>
<p class="card">Odaberi sliku → vidiš preview → klikni “OCR (server)” → ispiše OCR tekst + osnovne numeričke datume.</p>

<div class="card">
  <input id="file" type="file" accept="image/*,.png,.jpg,.jpeg"/>
  <button id="btn">OCR (server)</button>
</div>

<div class="card">
  <h3>Preview</h3>
  <canvas id="cv" width="10" height="10"></canvas>
</div>

<div class="card">
  <h3>Rezultati</h3>
  <div id="dates">—</div>
  <pre id="txt" style="background:#111;color:#9fe;padding:10px;border-radius:8px;max-height:260px;overflow:auto"></pre>
</div>

<h3>Log</h3>
<div id="log"></div>

<script>
const logEl = document.getElementById('log');
const log = m => { logEl.textContent += (m + "\\n"); console.log(m); };

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let hasImage = false;

function drawImageToCanvas(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const maxW = 1400;
      const scale = Math.min(1, maxW / img.naturalWidth);
      cv.width = Math.max(1, Math.round(img.naturalWidth*scale));
      cv.height= Math.max(1, Math.round(img.naturalHeight*scale));
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      hasImage = true;
      resolve();
    };
    img.onerror = reject;
    img.src = url;
  });
}

document.getElementById('file').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ await drawImageToCanvas(f); log('Slika učitana.'); }catch(err){ log('ERROR load: '+(err.message||err)); }
});

function extractNumericDates(text){
  const dates=[];
  const RX_DMY=/\\b(0?[1-9]|[12]\\d|3[01])[.\\-\\/ ](0?[1-9]|1[0-2])[.\\-\\/ ](\\d{4}|\\d{2})\\b/g;
  const RX_YMD=/\\b(\\d{4})[.\\-\\/ ](0?[1-9]|1[0-2])[.\\-\\/ ](0?[1-9]|[12]\\d|3[01])\\b/g;
  const RX_MY =/\\b(0?[1-9]|1[0-2])[.\\-\\/ ](\\d{4})\\b/g;
  let m;
  const toYear=y=>{y=parseInt(y,10);return y<100?2000+y:y;};
  const valid=(y,m,d)=>{const dt=new Date(y,m-1,d);return dt.getFullYear()==y&&dt.getMonth()==m-1&&dt.getDate()==d;};
  while((m=RX_DMY.exec(text))){const d=parseInt(m[1],10),mo=parseInt(m[2],10),y=toYear(m[3]);if(valid(y,mo,d)) dates.push({text:m[0],iso:new Date(y,mo-1,d).toISOString()});}
  while((m=RX_YMD.exec(text))){const y=parseInt(m[1],10),mo=parseInt(m[2],10),d=parseInt(m[3],10);if(valid(y,mo,d)) dates.push({text:m[0],iso:new Date(y,mo-1,d).toISOString()});}
  while((m=RX_MY.exec(text))){const mo=parseInt(m[1],10),y=parseInt(m[2],10);const d=new Date(y,mo,0).getDate();dates.push({text:m[0],iso:new Date(y,mo-1,d).toISOString(),approx:true});}
  // dedupe by iso+approx
  const seen=new Set(); return dates.filter(x=>{const k=x.iso+'|'+(x.approx?'~':''); if(seen.has(k)) return false; seen.add(k); return true;})
}

document.getElementById('btn').addEventListener('click', async ()=>{
  try{
    if (!hasImage){ return log('Nema slike u canvase.'); }
    const dataUrl = cv.toDataURL('image/png');
    log('Server OCR…');
    const r = await fetch('/api/ocr', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ image:dataUrl, psm:11 })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Server OCR error');
    document.getElementById('txt').textContent = j.text || '';
    const found = extractNumericDates(j.text || '');
    document.getElementById('dates').innerHTML = found.length
      ? ('<ul>'+found.map(x=>'<li>'+x.text+' → '+new Date(x.iso).toLocaleString('hr-HR',{timeZone:"Europe/Zagreb"})+(x.approx?' (≈ kraj mjeseca)':'')+'</li>').join('')+'</ul>')
      : 'Nema numeričkih datuma.';
    log('Gotovo. Duljina OCR teksta: '+((j.text||'').length));
  }catch(e){ log('ERROR OCR: '+(e.message||e)); }
});

// log JS greške
window.addEventListener('error', e=>{ const msg=e?.message||e; const line=e?.lineno?(' @'+e.filename+':'+e.lineno):''; log('JS error: '+msg+line); });
</script>
</body></html>
