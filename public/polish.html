<!doctype html>
<html lang="hr"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>HEIC → JPG (minimal)</title>
<style>
  body{font:14px system-ui;margin:0;padding:16px}
  #drop{border:2px dashed #999;border-radius:12px;padding:24px;text-align:center}
  .card{border:1px solid #ddd;border-radius:10px;padding:10px;margin-top:12px}
  canvas{max-width:100%;border:1px dashed #ccc;border-radius:8px}
  #log{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;background:#0b1020;color:#e6edf3;padding:8px;border-radius:8px;margin-top:12px}
</style>
</head>
<body>
<h2>HEIC → JPG (minimal)</h2>
<div id="drop">Povuci .heic datoteku ovdje ili klikni: <input id="file" type="file" accept=".heic,image/heic"/></div>
<div id="out"></div>
<div id="log"></div>

<script>
const out = document.getElementById('out');
const log = (m)=>{ const el=document.getElementById('log'); el.textContent += (m+"\\n"); console.log(m); };
const card=html=>{const d=document.createElement('div'); d.className='card'; d.innerHTML=html; out.appendChild(d); return d;};
const dl=(blob,name)=>{const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);};

async function convertHEIC(file){
  const n=card(`<b>${file.name}</b><div class=preview></div>`);
  try{
    log("Converting: "+file.name+" ("+file.size+" B)");
    const blob = await heic2any({ blob:file, toType:'image/jpeg', quality:0.9 });
    const img = new Image(); img.src = URL.createObjectURL(blob); await img.decode();
    const c = document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
    c.getContext('2d').drawImage(img,0,0);
    n.querySelector('.preview').appendChild(c);
    const jpg = await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));
    dl(jpg, file.name.replace(/\.heic$/i,'.jpg'));
    log("OK: "+file.name+" → JPG skinut");
  }catch(e){
    log("ERROR: "+(e && e.message ? e.message : e));
    const hint = document.createElement('div');
    hint.style.marginTop='8px';
    hint.innerHTML = "Ako vidiš grešku o heic2any: provjeri da si online i probaj u Chrome/Edge. Ako i dalje ne radi, javi tekst iz crnog bloka iznad.";
    n.appendChild(hint);
  }
}

async function handleFiles(files){
  for (const f of files){ if (/\.heic$/i.test(f.name)) await convertHEIC(f); else log("Preskačem (nije .heic): "+f.name); }
}

const input = document.getElementById('file');
input.addEventListener('change', e=> handleFiles(e.target.files));

const drop = document.getElementById('drop');
drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.style.background='#f5f5f5'; });
drop.addEventListener('dragleave', ()=> drop.style.background='');
drop.addEventListener('drop', e=>{ e.preventDefault(); drop.style.background=''; handleFiles(e.dataTransfer.files); });

// Učitaj heic2any sa CDN-a; ako padne, piši poruku
(function(){
  const s=document.createElement('script');
  s.src="https://unpkg.com/heic2any/dist/heic2any.min.js";
  s.onload=()=>log("heic2any učitan");
  s.onerror=()=>log("ERROR: heic2any se nije mogao učitati (provjeri internet / firewall)");
  document.head.appendChild(s);
})();
</script>
</body></html>
